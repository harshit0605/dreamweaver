name: CI / PR

# Runs on every PR + push to main. Default scope: L1-L4 layers
# (mocked LLM, mocked Convex). Cost: $0. Time budget: <4 minutes.
# Live-LLM smoke (L5) and Playwright E2E (L6) run in separate
# workflows on different cadences.

on:
  pull_request:
    branches: [main, "release/*"]
  push:
    branches: [main]

concurrency:
  # Cancel in-progress runs when a PR is updated; keeps the queue
  # short on busy days.
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (storyboard-agent)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storyboard-agent
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (editable)
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Run pytest (excluding LLM smoke)
        # `-m "not llm"` gates out the L5 live-LLM tests so PR CI
        # stays free. The nightly-llm-smoke workflow runs them.
        run: .venv/bin/python -m pytest tests/ -m "not llm" -q

  frontend:
    name: Frontend (dreamweaver-frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dreamweaver-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run bun test (chunked)
        # Chunked execution is required because bun's mock.module
        # is process-wide. See the package.json `_comment_test`.
        run: bun run test

      - name: Typecheck
        run: bunx tsc --noEmit
