name: Nightly / Live-LLM smoke

# Runs the L5 live-LLM smoke suite against real gpt-4.1-mini every
# night. Catches subagent-prompt drift, tool-schema regressions, and
# routing failures that mocked tests can't see.
#
# Cost: ~$0.006 per run (8 LLM calls, gpt-4.1-mini). Budget guard
# in tests/smoke/conftest.py auto-skips if the cumulative spend
# exceeds STORYBOARD_LLM_TEST_BUDGET_USD (default $2).
#
# Failure handling:
#   * Single failure: opens a tracking issue (handled below).
#   * 3 consecutive failures: paged via the configured Slack webhook.

on:
  schedule:
    # 02:00 UTC daily — pick a time after the daytime PR queue
    # quiets down so the workflow doesn't compete for cache.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    name: L5 — live-LLM smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: storyboard-agent
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY_NIGHTLY }}
      STORYBOARD_LLM_TEST_BUDGET_USD: "3.00"
      # Pin the model so prompt changes get smoked against a stable
      # baseline; cron runs ARE the regression net here.
      STORYBOARD_AGENT_MODEL: "openai:gpt-4.1-mini"
      # Disable LangSmith ingest (the smoke runs locally; trying to
      # ship traces to a cloud project that may not exist surfaces
      # spurious 403s in the cron log).
      LANGCHAIN_TRACING_V2: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Run live-LLM smoke
        # `-m llm` selects the marked tests; the conftest auto-skips
        # individual tests if the budget is exhausted.
        run: |
          .venv/bin/python -m pytest tests/smoke/ -m llm -v \
            --tb=short --color=no | tee smoke-output.txt

      - name: Upload smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-output
          path: storyboard-agent/smoke-output.txt
          retention-days: 14

      - name: Open issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            let body = "Live-LLM smoke failed.\n\n";
            try {
              const out = fs.readFileSync(
                "storyboard-agent/smoke-output.txt",
                "utf8",
              );
              body += "```\n" + out.slice(-4000) + "\n```";
            } catch {
              body += "(smoke-output.txt not produced — likely an install failure)";
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[nightly-llm-smoke] failed ${new Date().toISOString().slice(0, 10)}`,
              body,
              labels: ["test-failure", "agent", "nightly"],
            });
